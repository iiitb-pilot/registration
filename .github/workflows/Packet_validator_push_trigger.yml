name: packet-validator-stage Manual Build

on: 
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name to build from'
        required: true
        default: 'develop'
        type: string
      docker_tag:
        description: 'Docker tag (optional, defaults to branch name)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          server-id: ossrh
          settings-path: ${{ github.workspace }}

      - name: Setup branch and env
        run: |
          echo "BRANCH_NAME=${{ github.event.inputs.branch }}" >> $GITHUB_ENV
          echo "GPG_TTY=$(tty)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Setup settings file for ossrh server
        run: |
          cat > $GITHUB_WORKSPACE/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>ossrh</id>
                <username>${{secrets.ossrh_user}}</username>
                <password>${{secrets.ossrh_secret}}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>ossrh</id>
                <activation><activeByDefault>true</activeByDefault></activation>
                <properties>
                  <gpg.executable>gpg2</gpg.executable>
                  <gpg.passphrase>${{secrets.gpg_secret}}</gpg.passphrase>
                </properties>
              </profile>
            </profiles>
          </settings>
          EOF

      - name: Build with Maven
        run: |
          cd registration-processor
          mvn -B package -s $GITHUB_WORKSPACE/settings.xml -DskipTests -Dgpg.skip=true --file pom.xml

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Ready the springboot artifacts
        run: find . -name '*.jar' -type f -executable -exec zip release.zip {} + 2>/dev/null || true

      - name: Upload the springboot jars
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: ./release.zip

      - name: Extract JAR for Docker
        run: |
          SERVICE_LOCATION="registration-processor/pre-processor/registration-processor-packet-validator-stage"
          mkdir -p "./$SERVICE_LOCATION/target"
          unzip -o release.zip "$SERVICE_LOCATION/target/*.jar" -d "./" 2>/dev/null || true
          echo "Extracted JARs for Docker build"

      - name: Build Docker image
        run: |
          SERVICE_NAME="registration-processor-packet-validator-stage"
          SERVICE_LOCATION="registration-processor/pre-processor/registration-processor-packet-validator-stage"
          cd "./$SERVICE_LOCATION"
          docker build . \
            --build-arg SOURCE=mosip \
            --build-arg COMMIT_HASH=$(git rev-parse HEAD) \
            --build-arg COMMIT_ID=$(git rev-parse --short HEAD) \
            --build-arg BUILD_TIME=${{ steps.date.outputs.date }} \
            --file Dockerfile \
            --tag $SERVICE_NAME

      - name: Log into registry
        run: echo "${{ secrets.release_docker_hub }}" | docker login -u ${{ secrets.actor_docker_hub }} --password-stdin

      - name: Push image
        run: |
          NAMESPACE="${{ secrets.dev_namespace_docker_hub }}"
          SERVICE_NAME="registration-processor-packet-validator-stage"
          
          # Determine tag
          if [ -n "${{ github.event.inputs.docker_tag }}" ]; then
            VERSION="${{ github.event.inputs.docker_tag }}"
          else
            VERSION="${{ github.event.inputs.branch }}"
          fi
          
          IMAGE_ID=$(echo "$NAMESPACE/$SERVICE_NAME" | tr '[A-Z]' '[a-z]')
          echo "Pushing: $IMAGE_ID:$VERSION"
          
          docker tag $SERVICE_NAME $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:$VERSION
